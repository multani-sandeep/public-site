<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics — Forces and Motion Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .flip-card { perspective: 1000px; }
    .flip-inner { transition: transform 0.5s; transform-style: preserve-3d; display: grid; }
    .flipped .flip-inner { transform: rotateY(180deg); }
    .flip-front, .flip-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; grid-area: 1 / 1; }
    .flip-back { transform: rotateY(180deg); }
    pre.diagram { background: #0f172a; border: 1px solid #475569; border-radius: 0.5rem; padding: 0.75rem; font-size: 0.8rem; line-height: 1.25; overflow-x: auto; color: #cbd5e1; margin-top: 0.75rem; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-white" x-data="quiz()" x-cloak>

  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-white">Physics Flashcards</h1>
      <p class="text-sm text-slate-400">Forces and Motion · Hard · <span x-text="cards.length"></span> cards</p>
    </div>
    <div class="flex items-center gap-4 text-sm text-slate-400">
      <span>Card <span x-text="current + 1"></span> of <span x-text="cards.length"></span></span>
      <span class="text-green-400">✓ <span x-text="correct"></span></span>
      <span class="text-red-400">✗ <span x-text="incorrect"></span></span>
    </div>
  </header>

  <div class="h-1 bg-slate-700">
    <div class="h-1 bg-indigo-500 transition-all duration-300"
         :style="`width: ${((current + 1) / cards.length) * 100}%`"></div>
  </div>

  <main class="flex flex-col items-center justify-center px-4 py-12 gap-8">

    <div class="flip-card w-full max-w-2xl cursor-pointer" :class="{ flipped: revealed }" @click="reveal()">
      <div class="flip-inner">

        <div class="flip-front bg-slate-800 rounded-2xl border border-slate-700 p-8 flex flex-col justify-between shadow-xl">
          <div class="flex items-start gap-3">
            <span class="shrink-0 w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold"
                  x-text="current + 1"></span>
            <div class="text-lg leading-relaxed text-white min-w-0" x-html="cards[current].q"></div>
          </div>
          <div x-show="cards[current].img" class="mt-4">
            <img :src="cards[current].img" :alt="cards[current].imgAlt || 'Diagram'"
                 class="rounded-lg max-h-40 mx-auto object-contain border border-slate-600">
          </div>
          <p class="text-slate-500 text-sm text-center mt-4">Click to reveal answer</p>
        </div>

        <div class="flip-back bg-indigo-900 rounded-2xl border border-indigo-700 p-8 flex flex-col justify-between shadow-xl">
          <div>
            <p class="text-xs uppercase tracking-widest text-indigo-400 mb-3 font-semibold">Answer</p>
            <div class="text-lg leading-relaxed text-white" x-html="cards[current].a"></div>
          </div>
          <p class="text-slate-400 text-sm text-center mt-4">Mark yourself below</p>
        </div>

      </div>
    </div>

    <div x-show="revealed" x-transition class="flex gap-4">
      <button @click="mark(false)"
              class="flex items-center gap-2 px-6 py-3 rounded-xl bg-red-600 hover:bg-red-500 transition font-semibold">
        ✗ Got it wrong
      </button>
      <button @click="mark(true)"
              class="flex items-center gap-2 px-6 py-3 rounded-xl bg-green-600 hover:bg-green-500 transition font-semibold">
        ✓ Got it right
      </button>
    </div>

    <div x-show="!revealed" x-transition>
      <button @click="reveal()"
              class="px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold">
        Show Answer
      </button>
    </div>

  </main>

  <div x-show="done" x-transition
       class="fixed inset-0 z-50 bg-slate-900/95 flex flex-col items-center justify-center gap-6 p-8">
    <h2 class="text-3xl font-bold">Quiz Complete!</h2>
    <div class="flex gap-8 text-2xl">
      <div class="text-center"><p class="text-green-400 font-bold" x-text="correct"></p><p class="text-slate-400 text-sm">Correct</p></div>
      <div class="text-center"><p class="text-red-400 font-bold" x-text="incorrect"></p><p class="text-slate-400 text-sm">Incorrect</p></div>
      <div class="text-center"><p class="text-yellow-400 font-bold" x-text="Math.round((correct/cards.length)*100) + '%'"></p><p class="text-slate-400 text-sm">Score</p></div>
    </div>
    <div class="flex gap-4">
      <button @click="restart(false)"
              class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold">
        Restart All
      </button>
      <button @click="restart(true)" x-show="incorrect > 0"
              class="px-6 py-3 rounded-xl bg-red-700 hover:bg-red-600 transition font-semibold">
        Retry Wrong Cards
      </button>
    </div>
  </div>

  <script>
    const CARDS = [
      {
        q: `A car travels at $72\\ \\mathrm{km/h}$. Express this speed in $\\mathrm{m/s}$, and then state the distance it covers in $2.5$ minutes in km.`,
        a: `$72\\ \\mathrm{km/h} = \\dfrac{72\\,000\\ \\mathrm{m}}{3600\\ \\mathrm{s}} = $ <strong>$20\\ \\mathrm{m/s}$</strong><br>Time $= 2.5 \\times 60 = 150\\ \\mathrm{s}$<br>$s = vt = 20 \\times 150 = 3000\\ \\mathrm{m} = $ <strong>$3\\ \\mathrm{km}$</strong>`
      },
      {
        q: `Name the SI <strong>base</strong> units for mass, length and time. Then express the newton (unit of force) in terms of SI base units, using $F = ma$.`,
        a: `Mass: <strong>kilogram ($\\mathrm{kg}$)</strong>, length: <strong>metre ($\\mathrm{m}$)</strong>, time: <strong>second ($\\mathrm{s}$)</strong>.<br>$F = ma$ so $1\\ \\mathrm{N} = 1\\ \\mathrm{kg} \\times 1\\ \\mathrm{m/s^2} = $ <strong>$1\\ \\mathrm{kg\\,m\\,s^{-2}}$</strong>.<br>Note that the newton is a <em>derived</em> unit, not a base unit.`
      },
      {
        q: `Convert each into the unit given.<br>• $3.6 \\times 10^{5}\\ \\mathrm{mm}$ into km<br>• $4.2\\ \\mathrm{GHz}$ into Hz<br>• $250\\ \\mathrm{\\mu s}$ into s<br>• $0.8\\ \\mathrm{cm^2}$ into $\\mathrm{m^2}$`,
        a: `• $3.6 \\times 10^{5}\\ \\mathrm{mm} = 360\\ \\mathrm{m} = $ <strong>$0.36\\ \\mathrm{km}$</strong><br>• $4.2\\ \\mathrm{GHz} = $ <strong>$4.2 \\times 10^{9}\\ \\mathrm{Hz}$</strong><br>• $250\\ \\mathrm{\\mu s} = $ <strong>$2.5 \\times 10^{-4}\\ \\mathrm{s}$</strong><br>• $1\\ \\mathrm{cm^2} = (10^{-2})^2 = 10^{-4}\\ \\mathrm{m^2}$, so $0.8\\ \\mathrm{cm^2} = $ <strong>$8 \\times 10^{-5}\\ \\mathrm{m^2}$</strong> (areas: square the conversion factor!)`
      },
      {
        q: `Classify each quantity as a <strong>scalar</strong> or a <strong>vector</strong>: speed, velocity, displacement, distance, mass, weight, acceleration, energy, time, force.`,
        a: `<strong>Vectors</strong> (magnitude <em>and</em> direction): velocity, displacement, weight, acceleration, force.<br><strong>Scalars</strong> (magnitude only): speed, distance, mass, energy, time.<br>Common trap: <strong>weight is a vector</strong> (a force, directed towards the centre of the Earth) whereas <strong>mass is a scalar</strong>.`
      },
      {
        q: `A runner completes $2.5$ laps of a circular track of circumference $400\\ \\mathrm{m}$, starting from the start line. State the <strong>distance</strong> she has run and the <strong>magnitude of her displacement</strong> from the start.`,
        a: `<strong>Distance</strong> $= 2.5 \\times 400 = 1000\\ \\mathrm{m}$ (total path length, scalar).<br>After half a lap she is at the point <em>diametrically opposite</em> the start, so displacement = diameter.<br>$C = \\pi d \\Rightarrow d = \\dfrac{400}{\\pi} \\approx $ <strong>$127\\ \\mathrm{m}$</strong>, in a straight line from the start to her position.`
      },
      {
        q: `A hiker walks $6\\ \\mathrm{km}$ east in $1.5\\ \\mathrm{h}$, then $2\\ \\mathrm{km}$ west in $0.5\\ \\mathrm{h}$. Calculate her average <strong>speed</strong> and her average <strong>velocity</strong> for the whole journey.`,
        a: `Total distance $= 6 + 2 = 8\\ \\mathrm{km}$; total time $= 2.0\\ \\mathrm{h}$.<br>Average speed $= \\dfrac{8}{2} = $ <strong>$4\\ \\mathrm{km/h}$</strong> (scalar).<br>Net displacement $= 6 - 2 = 4\\ \\mathrm{km}$ east.<br>Average velocity $= \\dfrac{4}{2} = $ <strong>$2\\ \\mathrm{km/h}$ east</strong> (vector, direction required).`
      },
      {
        q: `The distance–time graph of a cyclist is made of straight lines joining these points:
<pre class="diagram">  t (s)  :   0    10    25    35    50
  s (m)  :   0    20    20    60     0

 s/m
 60 |                 /\\
    |                /  \\
 40 |               /    \\
    |              /      \\
 20 |       ______/        \\
    |      /                \\
  0 |_____/__________________\\_____ t/s
        0   10    25   35    50</pre>
Find (a) the speed in each of the four sections, (b) the total distance travelled, (c) the average speed and average velocity for the whole $50\\ \\mathrm{s}$.`,
        a: `Speed = gradient (magnitude):<br>• 0–10 s: $\\dfrac{20}{10} = $ <strong>$2\\ \\mathrm{m/s}$</strong><br>• 10–25 s: horizontal line, <strong>$0\\ \\mathrm{m/s}$</strong> (stationary)<br>• 25–35 s: $\\dfrac{40}{10} = $ <strong>$4\\ \\mathrm{m/s}$</strong><br>• 35–50 s: $\\dfrac{60}{15} = $ <strong>$4\\ \\mathrm{m/s}$</strong> back towards the start (velocity $-4\\ \\mathrm{m/s}$)<br>Total distance $= 20 + 40 + 60 = 120\\ \\mathrm{m}$, so average speed $= \\dfrac{120}{50} = $ <strong>$2.4\\ \\mathrm{m/s}$</strong>.<br>He ends where he started, so displacement $= 0$ and average velocity $= $ <strong>$0\\ \\mathrm{m/s}$</strong>.`
      },
      {
        q: `A train&apos;s velocity–time graph is made of straight lines joining these points:
<pre class="diagram">  t (s)  :   0     4    10    15
  v (m/s):   0    12    12     0

 v/(m/s)
 12 |      ________
    |     /        \\
    |    /          \\
    |   /            \\
  0 |__/______________\\___ t/s
       0  4        10  15</pre>
Calculate the acceleration in each section, the total distance travelled and the average speed.`,
        a: `Acceleration = gradient:<br>• 0–4 s: $a = \\dfrac{12 - 0}{4} = $ <strong>$3\\ \\mathrm{m/s^2}$</strong><br>• 4–10 s: <strong>$0\\ \\mathrm{m/s^2}$</strong> (constant velocity)<br>• 10–15 s: $a = \\dfrac{0 - 12}{5} = $ <strong>$-2.4\\ \\mathrm{m/s^2}$</strong> (deceleration)<br>Distance = <strong>area under graph</strong>: $\\tfrac{1}{2}(4)(12) + (6)(12) + \\tfrac{1}{2}(5)(12) = 24 + 72 + 30 = $ <strong>$126\\ \\mathrm{m}$</strong><br>Average speed $= \\dfrac{126}{15} = $ <strong>$8.4\\ \\mathrm{m/s}$</strong>`
      },
      {
        q: `(a) What does the <strong>gradient</strong> of a distance–time graph represent, and how would you find the speed at one instant when the graph is a curve?<br>(b) A velocity–time graph is a curve that gets steeper with time. What does this tell you about the motion?`,
        a: `(a) The gradient is the <strong>speed</strong> (velocity, if displacement is plotted). At a single instant on a curve, draw a <strong>tangent</strong> to the curve at that point and calculate its gradient $\\dfrac{\\Delta s}{\\Delta t}$.<br>(b) The gradient of a v–t graph is acceleration, so a steepening curve means the <strong>acceleration is increasing</strong> (non-uniform acceleration). The area under it still gives displacement.`
      },
      {
        q: `A car accelerates uniformly from rest at $3\\ \\mathrm{m/s^2}$ over a distance of $150\\ \\mathrm{m}$. Using the equations of motion, find its final speed and the time taken.`,
        a: `Known: $u = 0$, $a = 3\\ \\mathrm{m/s^2}$, $s = 150\\ \\mathrm{m}$ (no time given).<br>$v^2 = u^2 + 2as = 0 + 2(3)(150) = 900$<br>$v = $ <strong>$30\\ \\mathrm{m/s}$</strong><br>$a = \\dfrac{v - u}{t} \\Rightarrow t = \\dfrac{30}{3} = $ <strong>$10\\ \\mathrm{s}$</strong><br>Check: $s = \\tfrac{1}{2}(u+v)t = \\tfrac{1}{2}(30)(10) = 150\\ \\mathrm{m}$ ✓`
      },
      {
        q: `A driver travelling at $25\\ \\mathrm{m/s}$ sees a hazard. Her reaction time is $0.70\\ \\mathrm{s}$, and the brakes then produce a constant deceleration of $5.0\\ \\mathrm{m/s^2}$. Calculate the total stopping distance, and state two factors that would increase it.`,
        a: `Thinking distance $= vt = 25 \\times 0.70 = 17.5\\ \\mathrm{m}$<br>Braking distance: $v^2 = u^2 + 2as \\Rightarrow 0 = 25^2 - 2(5)s \\Rightarrow s = \\dfrac{625}{10} = 62.5\\ \\mathrm{m}$<br>Stopping distance $= 17.5 + 62.5 = $ <strong>$80\\ \\mathrm{m}$</strong><br>Increase <em>thinking</em> distance: tiredness, alcohol/drugs, distractions. Increase <em>braking</em> distance: higher speed, wet/icy road, worn tyres or brakes, greater mass of vehicle.`
      },
      {
        q: `A stone is dropped from a bridge and hits the water after $3.0\\ \\mathrm{s}$. Ignoring air resistance and taking $g = 10\\ \\mathrm{m/s^2}$, find the height of the bridge and the speed of the stone as it hits the water.`,
        a: `$u = 0$, $a = 10\\ \\mathrm{m/s^2}$, $t = 3.0\\ \\mathrm{s}$.<br>$s = ut + \\tfrac{1}{2}at^2 = 0 + \\tfrac{1}{2}(10)(3.0)^2 = $ <strong>$45\\ \\mathrm{m}$</strong><br>$v = u + at = 0 + 10 \\times 3.0 = $ <strong>$30\\ \\mathrm{m/s}$</strong> (downwards)`
      },
      {
        q: `A ball is thrown vertically upwards at $20\\ \\mathrm{m/s}$ ($g = 10\\ \\mathrm{m/s^2}$, no air resistance). Find (a) the time to reach its highest point, (b) the maximum height, (c) the total time in the air, and (d) its velocity on returning to the launch height.`,
        a: `Take upwards as positive, so $a = -10\\ \\mathrm{m/s^2}$; at the top $v = 0$.<br>(a) $t = \\dfrac{v - u}{a} = \\dfrac{0 - 20}{-10} = $ <strong>$2\\ \\mathrm{s}$</strong><br>(b) $v^2 = u^2 + 2as \\Rightarrow s = \\dfrac{0 - 400}{-20} = $ <strong>$20\\ \\mathrm{m}$</strong><br>(c) Motion is symmetrical: up $2\\ \\mathrm{s}$ + down $2\\ \\mathrm{s}$ = <strong>$4\\ \\mathrm{s}$</strong><br>(d) <strong>$20\\ \\mathrm{m/s}$ downwards</strong> (i.e. $-20\\ \\mathrm{m/s}$): same speed, opposite direction.`
      },
      {
        q: `A car cruises along a level road at a constant $30\\ \\mathrm{m/s}$ with a driving force of $2000\\ \\mathrm{N}$. State Newton&apos;s first law, and use it to find the total resistive force. What happens if the driving force is increased to $2500\\ \\mathrm{N}$?`,
        a: `<strong>Newton&apos;s 1st law:</strong> an object remains at rest or moves at constant velocity unless acted on by a resultant (unbalanced) force.<br>Constant velocity means the forces are balanced, so resistive force $= $ <strong>$2000\\ \\mathrm{N}$</strong> (opposite to the motion).<br>At $2500\\ \\mathrm{N}$ the resultant is $500\\ \\mathrm{N}$ forward, so the car <strong>accelerates</strong>. As speed rises, drag increases until the forces balance again at a higher constant speed.`
      },
      {
        q: `A $1200\\ \\mathrm{kg}$ car has a driving force of $3600\\ \\mathrm{N}$ and total resistive forces of $1200\\ \\mathrm{N}$. Calculate its acceleration, and the time to increase its speed from $10\\ \\mathrm{m/s}$ to $22\\ \\mathrm{m/s}$.`,
        a: `<strong>Newton&apos;s 2nd law:</strong> $F = ma$ where $F$ is the <em>resultant</em> force.<br>$F_{\\mathrm{res}} = 3600 - 1200 = 2400\\ \\mathrm{N}$<br>$a = \\dfrac{F}{m} = \\dfrac{2400}{1200} = $ <strong>$2.0\\ \\mathrm{m/s^2}$</strong><br>$t = \\dfrac{v - u}{a} = \\dfrac{22 - 10}{2.0} = $ <strong>$6.0\\ \\mathrm{s}$</strong>`
      },
      {
        q: `A book rests on a table. The Earth pulls the book down with its weight $W$, and the table pushes up on the book with a normal reaction $R$. A student says &quot;$W$ and $R$ are a Newton&apos;s third law pair&quot;. Explain why this is wrong, and identify the correct third-law pair for the weight of the book.`,
        a: `A third-law pair must be (i) the <strong>same type</strong> of force, (ii) <strong>equal in magnitude, opposite in direction</strong>, and (iii) act on <strong>two different objects</strong>.<br>$W$ and $R$ both act on the <em>book</em> and are different types of force (gravitational vs contact). They are equal and opposite only because the book is in equilibrium (1st law).<br>The pair for the book&apos;s weight is: <strong>the gravitational pull of the book on the Earth</strong>, upwards, acting on the Earth. (The pair for $R$ is the downward push of the book on the table.)`
      },
      {
        q: `An astronaut has mass $80\\ \\mathrm{kg}$. Taking $g = 10\\ \\mathrm{N/kg}$ on Earth and $1.6\\ \\mathrm{N/kg}$ on the Moon, find her mass and weight on each. Why is the unit $\\mathrm{N/kg}$ equivalent to $\\mathrm{m/s^2}$?`,
        a: `Mass is constant: <strong>$80\\ \\mathrm{kg}$ on both</strong>.<br>$W = mg$:<br>• Earth: $80 \\times 10 = $ <strong>$800\\ \\mathrm{N}$</strong><br>• Moon: $80 \\times 1.6 = $ <strong>$128\\ \\mathrm{N}$</strong><br>$1\\ \\mathrm{N/kg} = \\dfrac{1\\ \\mathrm{kg\\,m\\,s^{-2}}}{1\\ \\mathrm{kg}} = 1\\ \\mathrm{m/s^2}$. Gravitational field strength is also the <strong>free-fall acceleration</strong>.`
      },
      {
        q: `Describe, in terms of the forces acting, the motion of a skydiver from leaving the plane until landing with the parachute open. Include <strong>terminal velocity</strong> twice.`,
        a: `1. <strong>Just after jumping</strong>: only weight acts (drag $\\approx 0$), so resultant force is large and acceleration $\\approx g$.<br>2. As speed increases, <strong>air resistance (drag) increases</strong>, so resultant force and acceleration decrease.<br>3. <strong>Drag = weight</strong>: resultant force is zero, acceleration is zero and she falls at a constant <strong>terminal velocity</strong>.<br>4. <strong>Parachute opens</strong>: drag suddenly exceeds weight, so she decelerates (resultant upwards).<br>5. As speed falls, drag falls until it again equals weight: a new, lower <strong>terminal velocity</strong>, then she lands safely.`
      },
      {
        q: `A $5.0\\ \\mathrm{kg}$ box is pushed along a rough floor at a constant velocity by a horizontal force of $30\\ \\mathrm{N}$.<br>(a) What is the frictional force?<br>(b) The push is increased to $45\\ \\mathrm{N}$. Find the acceleration, assuming friction is unchanged.<br>(c) Explain what causes friction and what happens to the energy transferred.`,
        a: `(a) Constant velocity means balanced forces, so friction $= $ <strong>$30\\ \\mathrm{N}$</strong>, opposing the motion.<br>(b) $F_{\\mathrm{res}} = 45 - 30 = 15\\ \\mathrm{N}$, so $a = \\dfrac{15}{5.0} = $ <strong>$3.0\\ \\mathrm{m/s^2}$</strong>.<br>(c) Friction arises from <strong>microscopic roughness</strong> of the two surfaces interlocking and resisting relative motion. Work done against friction is transferred as <strong>thermal energy</strong> (heating the surfaces) and to the surroundings, which is dissipated.`
      },
      {
        q: `Two forces of $6\\ \\mathrm{N}$ and $8\\ \\mathrm{N}$ act on an object at right angles to each other. Find the magnitude and direction of the resultant force. If the object has mass $2.0\\ \\mathrm{kg}$, what is its acceleration?`,
        a: `Draw a vector triangle (tip-to-tail) and use Pythagoras:<br>$R = \\sqrt{6^2 + 8^2} = \\sqrt{100} = $ <strong>$10\\ \\mathrm{N}$</strong><br>Direction: $\\theta = \\tan^{-1}\\!\\left(\\dfrac{6}{8}\\right) = $ <strong>$37^\\circ$</strong> from the $8\\ \\mathrm{N}$ force.<br>$a = \\dfrac{F}{m} = \\dfrac{10}{2.0} = $ <strong>$5.0\\ \\mathrm{m/s^2}$</strong> in the direction of the resultant force.`
      },
      {
        q: `A $60\\ \\mathrm{kg}$ person stands on weighing scales in a lift (take $g = 10\\ \\mathrm{N/kg}$). Find the reading of the scales (in newtons) when the lift (a) is stationary, (b) accelerates upwards at $2.0\\ \\mathrm{m/s^2}$, (c) accelerates downwards at $2.0\\ \\mathrm{m/s^2}$. What happens in free fall?`,
        a: `The scales read the <strong>normal reaction $R$</strong> on the person. Take up as positive: $R - W = ma$.<br>(a) $a = 0$: $R = W = 60 \\times 10 = $ <strong>$600\\ \\mathrm{N}$</strong><br>(b) $R = m(g + a) = 60(10 + 2) = $ <strong>$720\\ \\mathrm{N}$</strong> (feels heavier)<br>(c) $R = m(g - a) = 60(10 - 2) = $ <strong>$480\\ \\mathrm{N}$</strong> (feels lighter)<br>Free fall: $a = g$, so $R = 0$: the person feels <strong>weightless</strong> even though gravity still acts on them.`
      }
    ];

    function quiz() {
      return {
        cards: CARDS,
        current: 0,
        revealed: false,
        correct: 0,
        incorrect: 0,
        done: false,
        wrongCards: [],

        init() {
          this.$watch('current', () => this.$nextTick(() => this.renderMath()));
          this.$nextTick(() => this.renderMath());
          window.addEventListener('load', () => this.renderMath());
        },
        renderMath() {
          if (window.renderMathInElement) {
            renderMathInElement(this.$el, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false
            });
          }
        },
        reveal() {
          this.revealed = true;
          this.$nextTick(() => this.renderMath());
        },
        mark(isCorrect) {
          if (isCorrect) this.correct++;
          else { this.incorrect++; this.wrongCards.push(this.cards[this.current]); }
          this.next();
        },
        next() {
          if (this.current < this.cards.length - 1) {
            this.current++;
            this.revealed = false;
          } else {
            this.done = true;
          }
        },
        restart(wrongOnly) {
          this.cards = wrongOnly ? [...this.wrongCards] : CARDS;
          this.current = 0;
          this.revealed = false;
          this.correct = 0;
          this.incorrect = 0;
          this.done = false;
          this.wrongCards = [];
          this.$nextTick(() => this.renderMath());
        }
      }
    }
  </script>
</body>
</html>
