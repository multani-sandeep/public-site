<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Science — Data Representation (1.1–1.3) Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- KaTeX for TeX/math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .flip-card { perspective: 1000px; }
    /* Grid layout allows card height to flex with content */
    .flip-inner { transition: transform 0.5s; transform-style: preserve-3d; display: grid; }
    .flipped .flip-inner { transform: rotateY(180deg); }
    .flip-front, .flip-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; grid-area: 1 / 1; }
    .flip-back { transform: rotateY(180deg); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(15, 23, 42, 0.6); padding: 0 0.3rem; border-radius: 0.25rem; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-white" x-data="quiz()" x-cloak>

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-white">Computer Science Flashcards</h1>
      <p class="text-sm text-slate-400">1. Data representation (1.1 Number systems · 1.2 Text, sound &amp; images · 1.3 Storage &amp; compression) · Hard · <span x-text="cards.length"></span> cards</p>
    </div>
    <div class="flex items-center gap-4 text-sm text-slate-400">
      <span>Card <span x-text="current + 1"></span> of <span x-text="cards.length"></span></span>
      <span class="text-green-400">✓ <span x-text="correct"></span></span>
      <span class="text-red-400">✗ <span x-text="incorrect"></span></span>
      <span class="text-amber-400" title="Not covered in school">⊘ <span x-text="notCovered"></span></span>
      <button @click="resetProgress()" class="text-xs px-2 py-1 rounded border border-slate-600 hover:bg-slate-700">Reset progress</button>
    </div>
  </header>

  <!-- Progress bar -->
  <div class="h-1 bg-slate-700">
    <div class="h-1 bg-indigo-500 transition-all duration-300"
         :style="`width: ${((current + 1) / cards.length) * 100}%`"></div>
  </div>

  <!-- Card area -->
  <main class="flex flex-col items-center justify-center px-4 py-12 gap-8">

    <!-- Flashcard -->
    <div class="flip-card w-full max-w-2xl cursor-pointer" :class="{ flipped: revealed }" @click="reveal()">
      <div class="flip-inner">

        <!-- Front (Question) -->
        <div class="flip-front bg-slate-800 rounded-2xl border border-slate-700 p-8 flex flex-col justify-between shadow-xl">
          <div class="flex items-start gap-3">
            <span class="shrink-0 w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold"
                  x-text="deck[current] + 1"></span>
            <p class="text-lg leading-relaxed text-white" x-html="cards[current].q"></p>
          </div>
          <div x-show="cards[current].img" class="mt-4">
            <img :src="cards[current].img" :alt="cards[current].imgAlt || 'Diagram'"
                 class="rounded-lg max-h-40 mx-auto object-contain border border-slate-600">
          </div>
          <p class="text-slate-500 text-sm text-center mt-4">Click to reveal answer</p>
        </div>

        <!-- Back (Answer) -->
        <div class="flip-back bg-indigo-900 rounded-2xl border border-indigo-700 p-8 flex flex-col justify-between shadow-xl">
          <div>
            <p class="text-xs uppercase tracking-widest text-indigo-400 mb-3 font-semibold">Answer</p>
            <p class="text-lg leading-relaxed text-white" x-html="cards[current].a"></p>
          </div>
          <p class="text-slate-400 text-sm text-center mt-4">Mark yourself below</p>
        </div>

      </div>
    </div>

    <!-- Controls — hidden until revealed -->
    <div x-show="revealed" x-transition class="flex flex-wrap justify-center gap-4">
      <button @click="mark('wrong')"
              class="flex items-center gap-2 px-6 py-3 rounded-xl bg-red-600 hover:bg-red-500 transition font-semibold">
        ✗ Got it wrong
      </button>
      <button @click="mark('skip')"
              class="flex items-center gap-2 px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 transition font-semibold">
        ⊘ Not covered in school
      </button>
      <button @click="mark('correct')"
              class="flex items-center gap-2 px-6 py-3 rounded-xl bg-green-600 hover:bg-green-500 transition font-semibold">
        ✓ Got it right
      </button>
    </div>

    <!-- Reveal button when not yet flipped -->
    <div x-show="!revealed" x-transition>
      <button @click="reveal()"
              class="px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold">
        Show Answer
      </button>
    </div>

  </main>

  <!-- Completion screen -->
  <div x-show="done" x-transition
       class="fixed inset-0 bg-slate-900/95 flex flex-col items-center justify-center gap-6 p-8">
    <h2 class="text-3xl font-bold">Quiz Complete!</h2>
    <div class="flex gap-8 text-2xl">
      <div class="text-center"><p class="text-green-400 font-bold" x-text="correct"></p><p class="text-slate-400 text-sm">Correct</p></div>
      <div class="text-center"><p class="text-red-400 font-bold" x-text="incorrect"></p><p class="text-slate-400 text-sm">Incorrect</p></div>
      <div class="text-center"><p class="text-amber-400 font-bold" x-text="notCovered"></p><p class="text-slate-400 text-sm">Not covered</p></div>
      <div class="text-center"><p class="text-yellow-400 font-bold" x-text="scorePct() + '%'"></p><p class="text-slate-400 text-sm">Score (excl. not covered)</p></div>
    </div>
    <div class="flex gap-4">
      <button @click="restart(false)"
              class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold">
        Restart All
      </button>
      <button @click="restart(true)" x-show="incorrect > 0"
              class="px-6 py-3 rounded-xl bg-red-700 hover:bg-red-600 transition font-semibold">
        Retry Wrong Cards
      </button>
    </div>
  </div>

  <script>
    function quiz() {
      // Progress is saved in localStorage, keyed per quiz page. SIG changes if the cards change,
      // so a regenerated quiz never loads stale progress. Every access is wrapped in try/catch
      // because storage can be blocked (private window, file://, cleared site data).
      const KEY = 'quiz-progress:' + location.pathname;
      const SIG = CARDS.length + ':' + (CARDS[0] ? CARDS[0].q.slice(0, 40) : '');
      const all = CARDS.map((_, i) => i);
      return {
        deck: all,            // indices into CARDS for the active run (all, or wrong-only retry)
        cards: CARDS,
        current: 0,
        revealed: false,
        correct: 0,
        incorrect: 0,
        notCovered: 0,        // cards marked "not covered in school" — excluded from score and retry
        done: false,
        wrongIdx: [],         // indices into CARDS answered wrong this run
        skipIdx: [],          // indices into CARDS marked not covered this run

        init() {
          this.load();
          this.$watch('current', () => this.$nextTick(() => this.renderMath()));
          this.$nextTick(() => this.renderMath());
        },
        save() {
          try {
            localStorage.setItem(KEY, JSON.stringify({
              sig: SIG, deck: this.deck, current: this.current, revealed: this.revealed,
              correct: this.correct, incorrect: this.incorrect, notCovered: this.notCovered, done: this.done,
              wrongIdx: this.wrongIdx, skipIdx: this.skipIdx
            }));
          } catch (e) { /* storage unavailable — quiz still works, just not remembered */ }
        },
        load() {
          try {
            const s = JSON.parse(localStorage.getItem(KEY));
            const valid = s && s.sig === SIG && Array.isArray(s.deck) && s.deck.length
              && s.deck.every(i => CARDS[i]) && Array.isArray(s.wrongIdx);
            if (!valid) return;
            this.deck = s.deck;
            this.cards = s.deck.map(i => CARDS[i]);
            this.current = Math.min(Math.max(s.current | 0, 0), this.cards.length - 1);
            this.revealed = !!s.revealed;
            this.correct = s.correct | 0;
            this.incorrect = s.incorrect | 0;
            this.notCovered = s.notCovered | 0;
            this.skipIdx = Array.isArray(s.skipIdx) ? s.skipIdx : [];
            this.done = !!s.done;
            this.wrongIdx = s.wrongIdx;
          } catch (e) { /* ignore corrupt or unavailable storage */ }
        },
        resetProgress() {
          try { localStorage.removeItem(KEY); } catch (e) {}
          this.restart(false);
        },
        renderMath() {
          if (window.renderMathInElement) {
            renderMathInElement(this.$el, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false
            });
          }
        },
        reveal() {
          this.revealed = true;
          this.save();
          this.$nextTick(() => this.renderMath());
        },
        mark(result) {   // 'correct' | 'wrong' | 'skip' (not covered in school)
          const idx = this.deck[this.current];
          if (result === 'correct') this.correct++;
          else if (result === 'skip') { this.notCovered++; this.skipIdx.push(idx); }
          else { this.incorrect++; this.wrongIdx.push(idx); }
          this.next();
        },
        scorePct() {
          const attempted = this.cards.length - this.notCovered;
          return attempted > 0 ? Math.round((this.correct / attempted) * 100) : 0;
        },
        next() {
          if (this.current < this.cards.length - 1) {
            this.current++;
            this.revealed = false;
          } else {
            this.done = true;
          }
          this.save();
        },
        restart(wrongOnly) {
          this.deck = wrongOnly ? [...this.wrongIdx] : all;
          this.cards = this.deck.map(i => CARDS[i]);
          this.current = 0;
          this.revealed = false;
          this.correct = 0;
          this.incorrect = 0;
          this.notCovered = 0;
          this.done = false;
          this.wrongIdx = [];
          this.skipIdx = [];
          this.save();
          this.$nextTick(() => this.renderMath());
        }
      }
    }

    const CARDS = [
      // ───────────── 1.1 Number systems ─────────────
      {
        q: "<strong>[1.1]</strong> Explain why computers use <strong>binary</strong> rather than denary to represent data.",
        a: "• Computers are built from electronic circuits (transistors / logic gates) that have only <strong>two states</strong>: on/off, high/low voltage — i.e. 1 and 0.<br>• Two states are easy to <strong>detect reliably</strong>; telling apart ten different voltage levels (for denary) would be error-prone.<br>• Binary maps directly onto logic gates and onto storage media (magnetised north/south, pit/land, charged/uncharged)."
      },
      {
        q: "<strong>[1.1]</strong> Convert the 8-bit binary number <code>10110101</code> to (a) denary and (b) hexadecimal. Show your working.",
        a: "(a) 128 + 32 + 16 + 4 + 1 = <strong>181</strong><br>(b) Split into nibbles: <code>1011</code> = B and <code>0101</code> = 5 → <strong>B5</strong><br>Check: $11 \\times 16 + 5 = 181$ ✓"
      },
      {
        q: "<strong>[1.1]</strong> Convert denary <strong>203</strong> to (a) 8-bit binary and (b) hexadecimal.",
        a: "(a) 203 = 128 + 64 + 8 + 2 + 1 → <strong><code>11001011</code></strong><br>(b) <code>1100</code> = C and <code>1011</code> = B → <strong>CB</strong><br>Check: $12 \\times 16 + 11 = 203$ ✓"
      },
      {
        q: "<strong>[1.1]</strong> Convert the 16-bit value, hexadecimal <strong>3F7A</strong>, to (a) binary and (b) denary.",
        a: "(a) One hex digit = 4 bits: 3 = 0011, F = 1111, 7 = 0111, A = 1010 → <strong><code>0011 1111 0111 1010</code></strong><br>(b) $3 \\times 4096 + 15 \\times 256 + 7 \\times 16 + 10 = 12288 + 3840 + 112 + 10 =$ <strong>16250</strong>"
      },
      {
        q: "<strong>[1.1]</strong> Give <strong>two reasons</strong> why hexadecimal is used to represent data, and <strong>two places</strong> where it is used.",
        a: "<strong>Reasons:</strong><br>• Much <strong>shorter</strong> than binary — one hex digit replaces 4 bits, so 16 bits become just 4 hex digits.<br>• Easier for humans to read, remember and type, so <strong>fewer transcription errors</strong>.<br>• Quick to convert to/from binary (just split into nibbles, no calculation).<br><strong>Uses:</strong> HTML/CSS colour codes (e.g. #FF8800), MAC addresses, memory addresses / debugging memory dumps, error codes.<br><em>Note: the computer still stores binary — hex is purely for humans.</em>"
      },
      {
        q: "<strong>[1.1]</strong> Add these two 8-bit binary integers and give the result in binary and denary:<br><code>01101110</code> + <code>01011011</code>",
        a: "<code>01101110</code> (110) + <code>01011011</code> (91)<br>= <strong><code>11001001</code> = 201</strong><br>There is no carry out of the leftmost bit, so <strong>no overflow</strong> (201 ≤ 255)."
      },
      {
        q: "<strong>[1.1]</strong> Add <code>11010110</code> and <code>10110101</code> using an 8-bit register. What happens, and what value is actually stored?",
        a: "Adding right to left with carries gives <code>1 10001011</code> — a <strong>9th bit</strong> is produced.<br>• 214 + 181 = 395, which exceeds 255 (the largest 8-bit value).<br>• The carry out of the leftmost bit is an <strong>overflow error</strong>: it cannot be stored in an 8-bit register.<br>• Stored value: <code>10001011</code> = 139, which is <strong>wrong</strong> (395 − 256 = 139)."
      },
      {
        q: "<strong>[1.1]</strong> Perform a <strong>logical left shift of 2 places</strong> on <code>00110101</code>. State the denary effect. What goes wrong if you shift it left by <em>3</em> places instead?",
        a: "• Shift 2 left: <code>11010100</code> — bits move left, zeros fill on the right. 53 → 212, i.e. <strong>multiplied by $2^2 = 4$</strong>.<br>• Shift 3 left: <code>10101000</code> = 168, but $53 \\times 8 = 424$. A <strong>1 was shifted off the left end</strong> and lost, so the answer is wrong (overflow)."
      },
      {
        q: "<strong>[1.1]</strong> Perform a <strong>logical right shift of 3 places</strong> on <code>10110100</code>. Show the denary effect and explain any loss of accuracy.",
        a: "• <code>10110100</code> (180) → <strong><code>00010110</code></strong> (22). Zeros fill in on the left.<br>• A right shift of 3 <strong>divides by $2^3 = 8$</strong> (ignoring remainders): 180 ÷ 8 = 22.5, but the answer is 22.<br>• The three bits shifted off the right (<code>100</code>) are lost, so the fractional part is lost — <strong>loss of precision</strong>."
      },
      {
        q: "<strong>[1.1]</strong> Represent <strong>−45</strong> as an 8-bit <strong>two&apos;s complement</strong> binary number. Show your steps.",
        a: "1. Write +45 in binary: <code>00101101</code><br>2. Invert all the bits: <code>11010010</code><br>3. Add 1: <strong><code>11010011</code></strong><br>Check using place values: −128 + 64 + 16 + 2 + 1 = −45 ✓"
      },
      {
        q: "<strong>[1.1]</strong> (a) What denary value does <code>10011100</code> represent in 8-bit two&apos;s complement? (b) State the range of denary values that 8-bit two&apos;s complement can store.",
        a: "(a) The most significant bit has place value <strong>−128</strong>: −128 + 16 + 8 + 4 = <strong>−100</strong><br>(b) <strong>−128 to +127</strong> (<code>10000000</code> to <code>01111111</code>). A leading 1 means the number is negative."
      },

      // ───────────── 1.2 Text, sound and images ─────────────
      {
        q: "<strong>[1.2]</strong> Explain why the <strong>Unicode</strong> character set was introduced when ASCII already existed. State one drawback of Unicode.",
        a: "• ASCII uses 7 bits (128 characters; extended ASCII uses 8 bits = 256). That covers English letters, digits and punctuation but <strong>not</strong> other alphabets (e.g. Arabic, Chinese, Hindi), many symbols or emojis.<br>• Unicode uses more bits per character (up to 32), giving over a million possible codes — it covers <strong>all languages and symbols</strong> in one standard. The first 128 codes match ASCII.<br>• <strong>Drawback:</strong> more bits per character → <strong>larger file sizes</strong> / more storage and bandwidth."
      },
      {
        q: "<strong>[1.2]</strong> In ASCII, the code for <strong>A is 65</strong> and for <strong>a is 97</strong>. Give the codes for <strong>D</strong> and <strong>d</strong>. Why does it help that the codes run in order?",
        a: "• D = 65 + 3 = <strong>68</strong>; d = 97 + 3 = <strong>100</strong> (lower case is always +32 from upper case).<br>• Letters have consecutive codes in alphabetical order, so a computer can <strong>sort or compare text</strong> by comparing the numeric codes, and convert case by adding/subtracting 32."
      },
      {
        q: "<strong>[1.2]</strong> Describe how an analogue sound wave is converted into a digital sound file. Define <strong>sample rate</strong> and <strong>sample resolution</strong>.",
        a: "• The amplitude of the wave is measured (<strong>sampled</strong>) at regular time intervals.<br>• Each sample is rounded to the nearest available level and stored as a <strong>binary number</strong>.<br><strong>Sample rate</strong> = number of samples taken per second (measured in Hz).<br><strong>Sample resolution</strong> = number of bits used to store each sample (bit depth)."
      },
      {
        q: "<strong>[1.2]</strong> A sound recording is re-recorded with a <strong>higher sample rate</strong> and a <strong>higher sample resolution</strong>. Describe the effect on (a) sound quality and (b) file size, with reasons.",
        a: "(a) <strong>Better quality</strong>: higher sample rate means the wave is measured more often, so the digital version follows the original more closely; higher resolution means each measurement is more accurate (more possible levels).<br>(b) <strong>Larger file</strong>: more samples per second, each using more bits, so more data is stored for the same length of recording."
      },
      {
        q: "<strong>[1.2]</strong> Define <strong>pixel</strong>, <strong>image resolution</strong> and <strong>colour depth</strong>. How does increasing each affect image quality and file size?",
        a: "<strong>Pixel</strong> = the smallest single-coloured element of an image.<br><strong>Resolution</strong> = number of pixels in the image (width × height). More pixels → more detail, sharper image, <strong>larger file</strong>.<br><strong>Colour depth</strong> = number of bits used to store the colour of each pixel. More bits → more colours available, smoother and more realistic shades, <strong>larger file</strong>."
      },
      {
        q: "<strong>[1.2]</strong> (a) How many colours can a <strong>12-bit</strong> colour depth represent? (b) What is the <strong>minimum</strong> colour depth needed for an image that uses 200 different colours?",
        a: "(a) $2^{12} =$ <strong>4096 colours</strong>.<br>(b) $2^7 = 128$ is too few, but $2^8 = 256$ is enough → <strong>8 bits</strong> per pixel.<br><em>Rule: n bits give $2^n$ colours.</em>"
      },
      {
        q: "<strong>[1.2]</strong> A photo is resized from <code>4000 × 3000</code> pixels to <code>2000 × 1500</code> pixels, keeping the same colour depth. How does the file size change, and what is the effect on quality?",
        a: "• Pixel count falls from 12,000,000 to 3,000,000 — a <strong>quarter</strong> (both dimensions halved), so the file size is roughly <strong>one quarter</strong> as large.<br>• Quality drops: <strong>less detail</strong>; enlarging the image will look blocky / pixelated."
      },

      // ───────────── 1.3 Data storage and compression ─────────────
      {
        q: "<strong>[1.3]</strong> (a) Convert 2.5 GiB into MiB. (b) How many <strong>bits</strong> are in 3 KiB? (c) Put in order, smallest first: byte, nibble, MiB, bit, KiB.",
        a: "(a) 2.5 × 1024 = <strong>2560 MiB</strong><br>(b) 3 × 1024 × 8 = <strong>24,576 bits</strong><br>(c) <strong>bit &lt; nibble (4 bits) &lt; byte (8 bits) &lt; KiB &lt; MiB</strong><br><em>Each step up from byte (KiB → MiB → GiB → TiB → PiB → EiB) is × 1024.</em>"
      },
      {
        q: "<strong>[1.3]</strong> An uncompressed image has <code>1024 × 512</code> pixels and uses <strong>16 different colours</strong>. Calculate the file size in bits, bytes and KiB (ignore metadata).",
        a: "• 16 colours → $2^4 = 16$ → colour depth <strong>4 bits</strong>.<br>• File size = width × height × colour depth<br>= $1024 \\times 512 \\times 4$ = <strong>2,097,152 bits</strong><br>• ÷ 8 = <strong>262,144 bytes</strong><br>• ÷ 1024 = <strong>256 KiB</strong> (= 0.25 MiB)"
      },
      {
        q: "<strong>[1.3]</strong> Calculate the file size of a <strong>30-second</strong> sound recording sampled at <strong>8000 Hz</strong> with a <strong>16-bit</strong> sample resolution. Give the answer in bytes and KiB.",
        a: "• File size = sample rate × resolution × length (seconds)<br>= $8000 \\times 16 \\times 30$ = <strong>3,840,000 bits</strong><br>• ÷ 8 = <strong>480,000 bytes</strong><br>• ÷ 1024 = <strong>468.75 KiB</strong>"
      },
      {
        q: "<strong>[1.3]</strong> State <strong>two reasons</strong> why files are compressed. Then explain the difference between <strong>lossy</strong> and <strong>lossless</strong> compression.",
        a: "<strong>Reasons:</strong> smaller files need <strong>less storage space</strong>; they <strong>transmit/download faster</strong> and use less bandwidth.<br><strong>Lossless:</strong> file is compressed so the <strong>original can be rebuilt exactly</strong> — no data is lost (e.g. RLE, PNG).<br><strong>Lossy:</strong> some data is <strong>permanently removed</strong>, so the original cannot be restored, but the file is much smaller (e.g. JPEG, MP3)."
      },
      {
        q: "<strong>[1.3]</strong> Describe <strong>two ways</strong> lossy compression can reduce (a) an image and (b) a sound file. Give a situation where <strong>lossless</strong> compression must be used, and why.",
        a: "(a) Image: reduce the <strong>resolution</strong> and/or reduce the <strong>colour depth</strong> (fewer bits per pixel).<br>(b) Sound: reduce the <strong>sample rate</strong> and/or <strong>sample resolution</strong>, or remove sounds humans can barely hear.<br><strong>Lossless needed</strong> for text documents, program code, spreadsheets, etc. — losing even a single character or bit would change the meaning or corrupt the file."
      },
      {
        q: "<strong>[1.3]</strong> (a) Use <strong>run-length encoding (RLE)</strong> to compress <code>AAAABBBCCDAAA</code>. (b) Decode <code>5W 2B 1W 3B</code>. (c) When is RLE ineffective?",
        a: "(a) Run counts: 4 A, 3 B, 2 C, 1 D, 3 A → <strong><code>4A 3B 2C 1D 3A</code></strong>. 13 characters become 5 pairs (10 characters).<br>(b) <strong><code>WWWWWBBWBBB</code></strong> (5 + 2 + 1 + 3 = 11 pixels).<br>(c) RLE is lossless and works best with <strong>long runs</strong> of identical data (logos, simple graphics). It is <strong>ineffective on photos or varied text</strong> with few repeats — e.g. <code>ABCD</code> becomes <code>1A 1B 1C 1D</code>, which is <em>larger</em>."
      }
    ];
  </script>
</body>
</html>
