<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemistry — Moles Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .flip-card { perspective: 1000px; }
    .flip-inner { transition: transform 0.5s; transform-style: preserve-3d; display: grid; }
    .flipped .flip-inner { transform: rotateY(180deg); }
    .flip-front, .flip-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; grid-area: 1 / 1; }
    .flip-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-white" x-data="quiz()" x-cloak>

  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-white">Chemistry Flashcards</h1>
      <p class="text-sm text-slate-400">Moles · Hard · <span x-text="cards.length"></span> cards</p>
    </div>
    <div class="flex items-center gap-4 text-sm text-slate-400">
      <span>Card <span x-text="current + 1"></span> of <span x-text="cards.length"></span></span>
      <span class="text-green-400">✓ <span x-text="correct"></span></span>
      <span class="text-red-400">✗ <span x-text="incorrect"></span></span>
      <button @click="resetProgress()" class="text-xs px-2 py-1 rounded border border-slate-600 hover:bg-slate-700">Reset progress</button>
    </div>
  </header>

  <div class="h-1 bg-slate-700">
    <div class="h-1 bg-indigo-500 transition-all duration-300"
         :style="`width: ${((current + 1) / cards.length) * 100}%`"></div>
  </div>

  <main class="flex flex-col items-center justify-center px-4 py-12 gap-8">
    <div class="flip-card w-full max-w-2xl cursor-pointer" :class="{ flipped: revealed }" @click="reveal()">
      <div class="flip-inner">
        <div class="flip-front bg-slate-800 rounded-2xl border border-slate-700 p-8 flex flex-col justify-between shadow-xl">
          <div class="flex items-start gap-3">
            <span class="shrink-0 w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold"
                  x-text="current + 1"></span>
            <p class="text-lg leading-relaxed text-white" x-html="cards[current].q"></p>
          </div>
          <p class="text-slate-500 text-sm text-center mt-4">Click to reveal answer</p>
        </div>
        <div class="flip-back bg-indigo-900 rounded-2xl border border-indigo-700 p-8 flex flex-col justify-between shadow-xl">
          <div>
            <p class="text-xs uppercase tracking-widest text-indigo-400 mb-3 font-semibold">Answer</p>
            <p class="text-lg leading-relaxed text-white" x-html="cards[current].a"></p>
          </div>
          <p class="text-slate-400 text-sm text-center mt-4">Mark yourself below</p>
        </div>
      </div>
    </div>

    <div x-show="revealed" x-transition class="flex gap-4">
      <button @click="mark(false)" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-red-600 hover:bg-red-500 transition font-semibold">✗ Got it wrong</button>
      <button @click="mark(true)" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-green-600 hover:bg-green-500 transition font-semibold">✓ Got it right</button>
    </div>
    <div x-show="!revealed" x-transition>
      <button @click="reveal()" class="px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold">Show Answer</button>
    </div>
  </main>

  <div x-show="done" x-transition class="fixed inset-0 bg-slate-900/95 flex flex-col items-center justify-center gap-6 p-8">
    <h2 class="text-3xl font-bold">Quiz Complete!</h2>
    <div class="flex gap-8 text-2xl">
      <div class="text-center"><p class="text-green-400 font-bold" x-text="correct"></p><p class="text-slate-400 text-sm">Correct</p></div>
      <div class="text-center"><p class="text-red-400 font-bold" x-text="incorrect"></p><p class="text-slate-400 text-sm">Incorrect</p></div>
      <div class="text-center"><p class="text-yellow-400 font-bold" x-text="Math.round((correct/cards.length)*100) + '%'"></p><p class="text-slate-400 text-sm">Score</p></div>
    </div>
    <div class="flex gap-4">
      <button @click="restart(false)" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-semibold">Restart All</button>
      <button @click="restart(true)" x-show="incorrect > 0" class="px-6 py-3 rounded-xl bg-red-700 hover:bg-red-600 transition font-semibold">Retry Wrong Cards</button>
    </div>
  </div>

  <script>
    const CARDS = [
      { q: String.raw`Calculate the amount, in mol, of nitrate ions in $8.2\ \mathrm{g}$ of calcium nitrate, $\mathrm{Ca(NO_3)}_2$. ($A_r$: Ca = 40, N = 14, O = 16)`,
        a: String.raw`$M_r = 40 + 2(14 + 48) = 164$<br>$n = 8.2 \div 164 = 0.050\ \mathrm{mol}$ of $\mathrm{Ca(NO_3)}_2$<br>Each formula unit has 2 nitrate ions, so <strong>0.10 mol</strong> of $\mathrm{NO_3^-}$.` },
      { q: String.raw`How many molecules are in $3.6\ \mathrm{g}$ of water, and how many atoms in total? (Avogadro constant $6.02 \times 10^{23}\ \mathrm{mol^{-1}}$; $A_r$: H = 1, O = 16)`,
        a: String.raw`$M_r = 18$, $n = 3.6 \div 18 = 0.20\ \mathrm{mol}$<br>Molecules $= 0.20 \times 6.02\times10^{23} = $ <strong>$1.20 \times 10^{23}$</strong><br>Each molecule has 3 atoms, so atoms $=$ <strong>$3.61 \times 10^{23}$</strong>.` },
      { q: String.raw`$5.00\ \mathrm{g}$ of calcium carbonate is thermally decomposed: $\mathrm{CaCO_3 \rightarrow CaO + CO_2}$. Calculate the volume of $\mathrm{CO_2}$ produced at room temperature and pressure (1 mol gas $= 24\ \mathrm{dm^3}$). ($A_r$: Ca = 40, C = 12, O = 16)`,
        a: String.raw`$M_r(\mathrm{CaCO_3}) = 100$; $n = 5.00 \div 100 = 0.0500\ \mathrm{mol}$<br>Ratio 1 : 1, so $n(\mathrm{CO_2}) = 0.0500\ \mathrm{mol}$<br>$V = 0.0500 \times 24 = $ <strong>$1.2\ \mathrm{dm^3}$</strong> ($1200\ \mathrm{cm^3}$).` },
      { q: String.raw`Calculate the mass of sodium chloride needed to make $250\ \mathrm{cm^3}$ of a solution of concentration $0.200\ \mathrm{mol/dm^3}$. ($A_r$: Na = 23, Cl = 35.5)`,
        a: String.raw`$n = c \times V = 0.200 \times 0.250 = 0.0500\ \mathrm{mol}$<br>$M_r = 58.5$<br>$m = n \times M_r = 0.0500 \times 58.5 = $ <strong>$2.93\ \mathrm{g}$</strong> (2.925 g).` },
      { q: String.raw`In a titration, $25.0\ \mathrm{cm^3}$ of sodium hydroxide solution is neutralised by $20.0\ \mathrm{cm^3}$ of $0.100\ \mathrm{mol/dm^3}$ sulfuric acid.<br>$\mathrm{H_2SO_4 + 2NaOH \rightarrow Na_2SO_4 + 2H_2O}$<br>Calculate the concentration of the NaOH in $\mathrm{mol/dm^3}$ and in $\mathrm{g/dm^3}$.`,
        a: String.raw`$n(\mathrm{H_2SO_4}) = 0.100 \times 0.0200 = 0.00200\ \mathrm{mol}$<br>Ratio 1 : 2, so $n(\mathrm{NaOH}) = 0.00400\ \mathrm{mol}$<br>$c = 0.00400 \div 0.0250 = $ <strong>$0.160\ \mathrm{mol/dm^3}$</strong><br>$M_r(\mathrm{NaOH}) = 40$, so <strong>$6.4\ \mathrm{g/dm^3}$</strong>.` },
      { q: String.raw`$0.60\ \mathrm{g}$ of magnesium reacts with excess hydrochloric acid. Write the balanced equation and calculate the volume of hydrogen produced at rtp. ($A_r$: Mg = 24)`,
        a: String.raw`$\mathrm{Mg + 2HCl \rightarrow MgCl_2 + H_2}$<br>$n(\mathrm{Mg}) = 0.60 \div 24 = 0.025\ \mathrm{mol}$; ratio 1 : 1 so $n(\mathrm{H_2}) = 0.025\ \mathrm{mol}$<br>$V = 0.025 \times 24 = $ <strong>$0.60\ \mathrm{dm^3}$</strong> ($600\ \mathrm{cm^3}$).` },
      { q: String.raw`A hydrocarbon contains $4.8\ \mathrm{g}$ of carbon and $1.2\ \mathrm{g}$ of hydrogen. Its relative molecular mass is 30. Find its empirical and molecular formulae. ($A_r$: C = 12, H = 1)`,
        a: String.raw`C: $4.8 \div 12 = 0.40$; H: $1.2 \div 1 = 1.2$<br>Divide by smallest: C = 1, H = 3<br>Empirical formula: <strong>$\mathrm{CH_3}$</strong> (mass 15)<br>$30 \div 15 = 2$, so molecular formula: <strong>$\mathrm{C_2H_6}$</strong>.` },
      { q: String.raw`An iron oxide contains 70% iron and 30% oxygen by mass. Determine its empirical formula. ($A_r$: Fe = 56, O = 16)`,
        a: String.raw`Fe: $70 \div 56 = 1.25$; O: $30 \div 16 = 1.875$<br>Ratio Fe : O $= 1 : 1.5$<br>Multiply by 2 to get whole numbers: $2 : 3$<br>Empirical formula: <strong>$\mathrm{Fe_2O_3}$</strong>.` },
      { q: String.raw`$2.50\ \mathrm{g}$ of hydrated copper(II) sulfate, $\mathrm{CuSO_4 \cdot xH_2O}$, is heated until $1.60\ \mathrm{g}$ of anhydrous $\mathrm{CuSO_4}$ remains. Find x. ($A_r$: Cu = 64, S = 32, O = 16, H = 1)`,
        a: String.raw`Mass of water lost $= 2.50 - 1.60 = 0.90\ \mathrm{g}$<br>$n(\mathrm{CuSO_4}) = 1.60 \div 160 = 0.0100\ \mathrm{mol}$<br>$n(\mathrm{H_2O}) = 0.90 \div 18 = 0.0500\ \mathrm{mol}$<br>Ratio $1 : 5$, so <strong>x = 5</strong>.` },
      { q: String.raw`$2.4\ \mathrm{g}$ of magnesium is added to $100\ \mathrm{cm^3}$ of $1.0\ \mathrm{mol/dm^3}$ hydrochloric acid. Identify the limiting reagent and calculate the volume of hydrogen produced at rtp. ($A_r$: Mg = 24)`,
        a: String.raw`$\mathrm{Mg + 2HCl \rightarrow MgCl_2 + H_2}$<br>$n(\mathrm{Mg}) = 2.4 \div 24 = 0.10\ \mathrm{mol}$ (needs 0.20 mol HCl)<br>$n(\mathrm{HCl}) = 1.0 \times 0.100 = 0.10\ \mathrm{mol}$, which is not enough<br><strong>HCl is the limiting reagent.</strong><br>$n(\mathrm{H_2}) = 0.10 \div 2 = 0.050\ \mathrm{mol}$, so $V = 0.050 \times 24 = $ <strong>$1.2\ \mathrm{dm^3}$</strong>.` },
      { q: String.raw`$10.0\ \mathrm{g}$ of $\mathrm{CaCO_3}$ is heated and $4.2\ \mathrm{g}$ of $\mathrm{CaO}$ is collected. Calculate the percentage yield. ($A_r$: Ca = 40, C = 12, O = 16)`,
        a: String.raw`$n(\mathrm{CaCO_3}) = 10.0 \div 100 = 0.100\ \mathrm{mol}$, so theoretical $n(\mathrm{CaO}) = 0.100\ \mathrm{mol}$<br>Theoretical mass $= 0.100 \times 56 = 5.6\ \mathrm{g}$<br>% yield $= (4.2 \div 5.6) \times 100 = $ <strong>75%</strong>.` },
      { q: String.raw`$20\ \mathrm{cm^3}$ of methane is burned in $100\ \mathrm{cm^3}$ of oxygen (all volumes measured at the same temperature and pressure). After cooling to room temperature, what is the composition and total volume of the remaining gas?<br>$\mathrm{CH_4 + 2O_2 \rightarrow CO_2 + 2H_2O}$`,
        a: String.raw`Gas volumes are in the same ratio as moles.<br>$\mathrm{O_2}$ used $= 2 \times 20 = 40\ \mathrm{cm^3}$, so $100 - 40 = 60\ \mathrm{cm^3}$ left over<br>$\mathrm{CO_2}$ formed $= 20\ \mathrm{cm^3}$<br>Water condenses to liquid, so it is not counted.<br>Remaining gas: <strong>$60\ \mathrm{cm^3}\ \mathrm{O_2}$ + $20\ \mathrm{cm^3}\ \mathrm{CO_2}$ = $80\ \mathrm{cm^3}$</strong>.` }
    ];

    function quiz() {
      // Progress is saved in localStorage, keyed per quiz page. SIG changes if the cards change,
      // so a regenerated quiz never loads stale progress. Every access is wrapped in try/catch
      // because storage can be blocked (private window, file://, cleared site data).
      const KEY = 'quiz-progress:' + location.pathname;
      const SIG = CARDS.length + ':' + (CARDS[0] ? CARDS[0].q.slice(0, 40) : '');
      const all = CARDS.map((_, i) => i);
      return {
        deck: all,            // indices into CARDS for the active run (all, or wrong-only retry)
        cards: CARDS,
        current: 0,
        revealed: false,
        correct: 0,
        incorrect: 0,
        done: false,
        wrongIdx: [],         // indices into CARDS answered wrong this run

        init() {
          this.load();
          this.$watch('current', () => this.$nextTick(() => this.renderMath()));
          this.$nextTick(() => this.renderMath());
          window.addEventListener('load', () => this.renderMath());
        },
        save() {
          try {
            localStorage.setItem(KEY, JSON.stringify({
              sig: SIG, deck: this.deck, current: this.current, revealed: this.revealed,
              correct: this.correct, incorrect: this.incorrect, done: this.done, wrongIdx: this.wrongIdx
            }));
          } catch (e) { /* storage unavailable — quiz still works, just not remembered */ }
        },
        load() {
          try {
            const s = JSON.parse(localStorage.getItem(KEY));
            const valid = s && s.sig === SIG && Array.isArray(s.deck) && s.deck.length
              && s.deck.every(i => CARDS[i]) && Array.isArray(s.wrongIdx);
            if (!valid) return;
            this.deck = s.deck;
            this.cards = s.deck.map(i => CARDS[i]);
            this.current = Math.min(Math.max(s.current | 0, 0), this.cards.length - 1);
            this.revealed = !!s.revealed;
            this.correct = s.correct | 0;
            this.incorrect = s.incorrect | 0;
            this.done = !!s.done;
            this.wrongIdx = s.wrongIdx;
          } catch (e) { /* ignore corrupt or unavailable storage */ }
        },
        resetProgress() {
          try { localStorage.removeItem(KEY); } catch (e) {}
          this.restart(false);
        },
        renderMath() {
          if (window.renderMathInElement) {
            renderMathInElement(this.$el, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false
            });
          }
        },
        reveal() {
          this.revealed = true;
          this.save();
          this.$nextTick(() => this.renderMath());
        },
        mark(isCorrect) {
          if (isCorrect) this.correct++;
          else { this.incorrect++; this.wrongIdx.push(this.deck[this.current]); }
          this.next();
        },
        next() {
          if (this.current < this.cards.length - 1) {
            this.current++;
            this.revealed = false;
          } else {
            this.done = true;
          }
          this.save();
        },
        restart(wrongOnly) {
          this.deck = wrongOnly ? [...this.wrongIdx] : all;
          this.cards = this.deck.map(i => CARDS[i]);
          this.current = 0;
          this.revealed = false;
          this.correct = 0;
          this.incorrect = 0;
          this.done = false;
          this.wrongIdx = [];
          this.save();
          this.$nextTick(() => this.renderMath());
        }
      }
    }
  </script>
</body>
</html>
